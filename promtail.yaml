server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  - job_name: blr_prod_logs

    static_configs:
      - targets:
          - localhost
        labels:
          job: blr_logs
          __path__: /var/log/blrserverlogs/*/*/*/*/*.log

    pipeline_stages:
      - regex:
          expression: '/var/log/blrserverlogs/(?P<server_ip>[^/]+)/'
      - labels:
          server_ip:

      - drop:
          expression: '(?i)(nxlog|promtail|loki)'
